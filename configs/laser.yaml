# Laser geometry in camera coordinates (OpenCV convention: x right, y down, z forward), mm.
# The laser apex sits `baseline_mm` BELOW the camera centre (+y) and is tilted up toward the
# optical axis, so the projected line appears roughly horizontal in the image.
# The line crosses the optical axis at z = baseline / tan(tilt) = 12 / tan(30.96 deg) = 20 mm.
# Usable depth range (line stays inside the sensor) is then about 14 to 34 mm.
wavelength_nm: 532
baseline_mm: 12.0
tilt_deg: 30.96
fan_half_angle_deg: 25.0
line_sigma_px: 1.5
